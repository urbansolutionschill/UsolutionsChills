<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }

  body {
    background: #f8f9fc;
  }

  .contact-section {
    max-width: 1100px;
    margin: 50px auto;
    padding: 40px;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  .contact-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .contact-header h2 {
    font-size: 2em;
    color: #222;
  }

  .contact-header p {
    color: #666;
    font-size: 1em;
  }

  .contact-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
  }

  .contact-card {
    background: #f3f6ff;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    transition: all 0.3s ease;
  }

  .contact-card:hover {
    background: #e8edff;
    transform: translateY(-5px);
  }

  .contact-card i {
    font-size: 35px;
    color: #3b5bdb;
    margin-bottom: 15px;
  }

  .contact-card h4 {
    margin-bottom: 10px;
    color: #222;
  }

  .contact-card p, .contact-card a {
    color: #555;
    text-decoration: none;
    font-size: 0.95em;
  }

  .contact-card a:hover {
    color: #3b5bdb;
  }

  /* Make the address card clickable */
  .map-link {
    display: block;
    color: inherit;
    text-decoration: none;
  }

  .map-link:hover {
    color: #3b5bdb;
  }

  @media (max-width: 768px) {
    .contact-section {
      margin: 20px;
      padding: 25px;
    }
  }
</style>
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<section class="contact-section">
  <div class="contact-header">
    <h2>Contact Us</h2>
    <p>We’d love to hear from you! Reach out through any of the methods below.</p>
  </div>

  <div class="contact-info">
    <div class="contact-card">
      <i class="fas fa-phone-alt"></i>
      <h4>Phone</h4>
      <p><a href="tel:+911234567890">+91 12345 67890</a></p>
    </div>

    <div class="contact-card">
      <i class="fas fa-envelope"></i>
      <h4>Email</h4>
      <p><a href="mailto:info@yourwebsite.com">info@yourwebsite.com</a></p>
    </div>

    <!-- Office address card with Google Maps redirect -->
    <a class="contact-card map-link"
       href="https://www.google.com/maps/dir/?api=1&destination=13.0479859,79.8789912"
       target="_blank">
      <i class="fas fa-map-marker-alt"></i>
      <h4>Office Address</h4>
      <p> Bonghughi Bazar, Abhayapuri to Lengtishinga Rd, Balikuri Gaon, Assam</p>
    </a>

    <div class="contact-card">
      <i class="fas fa-clock"></i>
      <h4>Working Hours</h4>
      <p>Mon - Sat: 9:00 AM - 6:00 PM</p>
    </div>
  </div>
</section>

</body>
</html>
